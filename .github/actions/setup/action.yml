name: Setup toolchain
description: >-
  Installs Node, pnpm and Terraform at the versions pinned in mise.toml
  (checked against mise.lock), restores the pnpm store cache, and installs
  dependencies. Every workflow uses this so none can drift from the others.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after setup.
    default: "true"

runs:
  using: composite
  steps:
    # mise itself is pinned too, so a new mise release can't change CI
    # without a diff here. sha256 is the linux-x64 binary from that release's
    # SHASUMS256.txt (all our workflows run on ubuntu). mise-action adds
    # `--locked` on its own because mise.lock exists.
    - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        version: 2026.9.16
        sha256: b6f8757201f6a2ee799f45f3f52ef7ca0b4071523637dc3b0b24264dd3333518
      # Preloop (also in mise.toml) is for running workflows locally, not in CI.
      env:
        MISE_DISABLE_TOOLS: github:preloopdev/preloop

    # mise-action caches the tools, not pnpm's package store.
    - id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-store-${{ runner.os }}-

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
