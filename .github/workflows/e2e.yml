name: E2E

# Spins up the api/web/playwright stack (docker-compose-e2e.yml, via
# scripts/e2e-ci.sh) and runs the Playwright suite against it. Uploads the
# HTML report as an artifact regardless of pass/fail so failures are
# debuggable without re-running locally.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Run e2e suite
        run: ./scripts/e2e-ci.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
