name: Deploy web app to Azure Static Web Apps

# Branch -> GitHub Environment mapping matches deploy-api.yml (1:1 except main -> production).
# Each target environment needs its own GitHub Environment (Settings > Environments) with an
# AZURE_STATIC_WEB_APPS_API_TOKEN secret set to the Static Web App's deployment token
# (azurerm_static_web_app's `api_key` attribute — not the OIDC identity from
# infra/template/github_actions_identity.tf, which this action doesn't use).
# Optional repo variable (see SBOM.md): SBOM_ARTIFACT_ENABLED = "false" turns off the
# SBOM step (on by default). The SBOM is also scanned with Grype (report only, never blocks).
on:
  push:
    branches:
      - develop
      - qa
      - staging
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment to deploy to
        required: true
        type: choice
        options:
          - develop
          - qa
          - staging
          - production

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'production' || github.ref_name }}
    env:
      DEPLOY_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node, pnpm and Terraform from mise.toml, pnpm store cache, pnpm install.
      - uses: ./.github/actions/setup

      - name: Build web app
        run: pnpm turbo build --filter=web
        env:
          # This template's web app only reads VITE_API_BASE_URL today (see
          # apps/web/.env.example) — add further VITE_* secrets here as your project adds them.
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "apps/web/dist" # App build output (built artifact) path
          skip_app_build: true

      # Artifact SBOM (client deliverable): the web app's production npm deps.
      # The Vite bundle hides which packages it contains, so this reads the
      # lockfile. Runs after Deploy so nothing it runs can touch apps/web/dist
      # before the upload, and uses the cdxgen that pnpm installed from
      # pnpm-lock.yaml (packages/sbom-tools), so its whole tree is locked.
      # Never blocks the deploy.
      - name: Generate web SBOM
        id: sbom
        if: vars.SBOM_ARTIFACT_ENABLED != 'false'
        continue-on-error: true
        uses: ./.github/actions/sbom-lockfile
        with:
          name: web-${{ env.DEPLOY_ENV }}-${{ github.sha }}
          mode: prod
          workspace: apps/web
          cdxgen-bin: ${{ github.workspace }}/packages/sbom-tools/node_modules/.bin/cdxgen

      # Vulnerability + flagged license report for the web SBOM, in the job
      # summary. Runs after the deploy so it never delays or blocks it.
      - name: Scan web SBOM
        if: ${{ !cancelled() && steps.sbom.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/sbom-scan
        with:
          sbom-file: ${{ steps.sbom.outputs.sbom-file }}
          name: web-${{ env.DEPLOY_ENV }}
          fail-on: none
